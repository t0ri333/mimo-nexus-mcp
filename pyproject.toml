[project]
name = "mimo-nexus-mcp"
version = "0.1.0"
description = "Lightweight MCP intelligent gateway for token-efficient AI coding with Xiaomi MiMo 2.5 Pro"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emily" }]
keywords = ["mcp", "mimo", "ai", "token-saving", "gateway", "coding-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=3.4.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.2",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
mimo-nexus = "mimo_nexus.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimo_nexus"]
